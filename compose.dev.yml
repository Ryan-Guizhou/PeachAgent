services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: ["--lower-case-table-names=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: peachagent
      MYSQL_USER: ${DB_USER:?configure DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?configure DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/INIT_DATABASE.SQL:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?configure REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?configure REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
  redis_data:
    name: ${REDIS_DATA_VOLUME:-peachagent_redis_data}
