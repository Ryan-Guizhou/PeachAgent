spring:
  application:
    name: peachagent
  profiles:
    default: api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/peachagent?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 128
        prepStmtCacheSqlLimit: 4096
        useServerPrepStmts: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/common
    validate-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.starttls.required: ${SMTP_TLS:false}
  main:
    keep-alive: true
sa-token:
  token-name: PA_SESSION
  timeout: 604800
  active-timeout: 7200
  is-concurrent: true
  is-share: false
  token-style: random-64
  is-read-cookie: true
  is-read-header: false
  is-read-body: false
  is-log: false
  cookie:
    http-only: true
    secure: ${COOKIE_SECURE:true}
    same-site: Strict
    path: /
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
peachagent:
  public-origin: ${PUBLIC_ORIGIN:http://localhost:8080}
  mail-from: ${MAIL_FROM:${SMTP_USER:}}
  credential-kek: ${CREDENTIAL_KEK:}
  credential-kek-version: ${CREDENTIAL_KEK_VERSION:1}
  allowed-internal-origins: ${PEACHAGENT_ALLOWED_INTERNAL_ORIGINS:}
  artifact-directory: ${PEACHAGENT_ARTIFACT_DIRECTORY:./data/artifacts}
