name: Prototype verification
on:
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline contracts
        run: node prototype/src/qa/integration.cjs
      - name: Static source and markup checks
        run: python prototype/src/qa/verify-sources.py
      - name: Rebuild offline HTML and verify consistency
        run: |
          python prototype/src/build.py
          git diff --exit-code -- prototype/OTRYX_Studio.html
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/peachagent-browser-qa" --no-save --no-package-lock playwright@1.56.1
      - name: Chromium browser smoke
        env:
          NODE_PATH: ${{ runner.temp }}/peachagent-browser-qa/node_modules
        run: node prototype/src/qa/browser-smoke.cjs
