name: P1 dependency security
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/p1-security.yml'
      - '.gitleaks.toml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify or generate npm resolution
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
            git diff --exit-code -- package-lock.json
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          fi
      - name: Export public lock metadata for review
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          from urllib.parse import urlsplit
          data=Path("package-lock.json").read_bytes()
          lock=json.loads(data)
          assert lock["lockfileVersion"] == 3
          for package in lock["packages"].values():
              resolved=package.get("resolved")
              if resolved:
                  url=urlsplit(resolved)
                  assert url.scheme=="https" and url.netloc=="registry.npmjs.org" and not url.query and not url.fragment
          print("LOCK_SHA256="+hashlib.sha256(data).hexdigest())
          encoded=base64.b64encode(data).decode("ascii")
          for index in range(0,len(encoded),1500):
              print("LOCK_CHUNK="+encoded[index:index+1500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p1-npm-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 2
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Resolve all Maven modules and generate CycloneDX SBOM
        run: mvn -B -f backend/pom.xml -DskipTests install org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -Dcyclonedx.outputFormat=json -Dcyclonedx.skipAttach=true
      - name: Verify aggregate SBOM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          bom=json.loads(Path("backend/target/bom.json").read_text())
          packages=[c for c in bom["components"] if c.get("purl","").startswith("pkg:maven/")]
          assert len(packages)>20, "Incomplete Maven dependency SBOM"
          print("Maven components:",len(packages))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p1-java-sbom
          path: backend/target/bom.json
          if-no-files-found: error
          retention-days: 7
  vulnerability:
    needs: sbom
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      download-artifact: p1-java-sbom
      scan-args: |
        --lockfile=bom.json
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      contents: read
      actions: read
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked source for secrets (redacted)
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          docker run --rm -v "$tmp:/repo:ro" zricethezav/gitleaks:v8.30.1 dir /repo --redact=100 --no-banner
