name: P1 backend
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.dev.yml'
      - '.github/workflows/p1-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real vendor smoke plan offline
        run: python3 backend/qa/vendor-smoke.py --config backend/qa/vendor-smoke.example.json
      - name: Build Vue and install Chromium QA
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Compile and unit tests
        run: mvn -B -f backend/pom.xml verify
      - name: Start real database, Redis and SMTP
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          DB_USER: peachagent
          DB_PASSWORD: ci-only-db
          REDIS_PASSWORD: ci-only-redis
        run: docker compose -f compose.dev.yml up -d --wait mysql redis mailpit
      - name: Verify API and worker startup
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/peachagent
          DB_USER: peachagent
          DB_PASSWORD: ci-only-db
          REDIS_PASSWORD: ci-only-redis
          COOKIE_SECURE: 'false'
          PEACHAGENT_ALLOWED_INTERNAL_ORIGINS: http://127.0.0.1:18081
        run: |
          set -euo pipefail
          # Generate a fresh test-only KEK; API and Worker inherit it in this job.
          export CREDENTIAL_KEK="$(openssl rand -base64 32)"
          echo "::add-mask::$CREDENTIAL_KEK"
          JAR=backend/peachagent-bootstrap/target/peachagent-bootstrap-1.0.0-SNAPSHOT.jar
          java -jar "$JAR" --spring.profiles.active=api --spring.web.resources.static-locations="file:$(pwd)/frontend/dist/" > api.log 2>&1 &
          API=$!
          trap 'kill "$API" ${WORKER:-} 2>/dev/null || true; cat api.log; test ! -f worker.log || cat worker.log; test ! -f worker-recovery.log || cat worker-recovery.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then break; fi
            kill -0 "$API"; sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          python3 backend/qa/iam-smoke.py
          java -jar "$JAR" --spring.profiles.active=worker > worker.log 2>&1 &
          WORKER=$!
          for i in $(seq 1 40); do
            if grep -q 'Started PeachAgentApplication' worker.log; then break; fi
            kill -0 "$WORKER"; sleep 1
          done
          grep -q 'Started PeachAgentApplication' worker.log
          kill -0 "$WORKER"
          PEACHAGENT_TEST_WORKER_PID="$WORKER" PEACHAGENT_TEST_WORKER_JAR="$JAR" python3 backend/qa/runtime-smoke.py
          # The fault test terminates its recovery worker; restore the ordinary worker for browser QA.
          wait "$WORKER" || true
          java -jar "$JAR" --spring.profiles.active=worker >> worker.log 2>&1 &
          WORKER=$!
          kill -0 "$WORKER"
          node frontend/qa/p1-browser-smoke.mjs
      - name: Audit frontend dependencies
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-browser-evidence
          path: frontend/qa/evidence/
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          DB_USER: peachagent
          DB_PASSWORD: ci-only-db
          REDIS_PASSWORD: ci-only-redis
        run: docker compose -f compose.dev.yml down -v || true
