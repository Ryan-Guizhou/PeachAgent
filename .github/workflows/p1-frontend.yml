name: P1 Frontend
on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "compose.dev.yml"
      - ".github/workflows/p1-frontend.yml"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
