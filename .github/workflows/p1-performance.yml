name: P1 performance
on:
  pull_request:
    paths:
      - 'backend/qa/performance-smoke.py'
      - 'backend/qa/performance-client-test.py'
      - 'backend/peachagent-common/src/main/java/com/peachsoft/peachagent/common/pagination/**'
      - '.github/workflows/p1-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MYSQL_ROOT_PASSWORD: perf-only-root
      DB_USER: peachagent
      DB_PASSWORD: perf-only-db
      REDIS_PASSWORD: perf-only-redis
      DB_URL: jdbc:mysql://127.0.0.1:3306/peachagent
      COOKIE_SECURE: 'false'
      PEACHAGENT_ALLOWED_INTERNAL_ORIGINS: http://127.0.0.1:18081
      PEACHAGENT_ISOLATED_PERF: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Validate read load generator
        run: python3 backend/qa/performance-client-test.py
      - name: Package API and Worker
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Start isolated database and middleware
        run: docker compose -f compose.dev.yml up -d --wait mysql redis mailpit
      - name: Benchmark 100k history, concurrent reads and writes, ten minute soak
        run: |
          set -euo pipefail
          export CREDENTIAL_KEK="$(openssl rand -base64 32)"
          export PEACHAGENT_PERF_PASSWORD="Qa-$(openssl rand -hex 20)-Aa1!"
          echo "::add-mask::$CREDENTIAL_KEK"
          echo "::add-mask::$PEACHAGENT_PERF_PASSWORD"
          JAR=backend/peachagent-bootstrap/target/peachagent-bootstrap-1.0.0-SNAPSHOT.jar
          java -jar "$JAR" --spring.profiles.active=api > perf-api.log 2>&1 &
          API=$!
          trap 'kill "$API" ${WORKER:-} 2>/dev/null || true; test ! -f perf-worker.log || grep -E "Run (claim|execution|settlement|recovery)|Transient run settlement|Deadlock|WARN|ERROR" perf-worker.log | tail -n 60 || true' EXIT
          # Only the API role migrates the database. The worker must start after its contract check.
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"' && grep -q 'Database contract verified' perf-api.log; then break; fi
            kill -0 "$API"; sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          grep -q 'Database contract verified' perf-api.log
          kill -0 "$API"
          java -jar "$JAR" --spring.profiles.active=worker > perf-worker.log 2>&1 &
          WORKER=$!
          for i in $(seq 1 60); do
            if grep -q 'Database contract verified' perf-worker.log; then break; fi
            kill -0 "$WORKER"; sleep 1
          done
          grep -q 'Database contract verified' perf-worker.log
          kill -0 "$API" "$WORKER"
          export PEACHAGENT_PERF_WORKER_PID="$WORKER"
          export PEACHAGENT_PERF_API_PID="$API"
          python3 backend/qa/performance-smoke.py
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-performance-evidence
          path: |
            backend/qa/evidence/performance.json
            perf-api.log
            perf-worker.log
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup isolated database
        if: always()
        run: docker compose -f compose.dev.yml down -v
