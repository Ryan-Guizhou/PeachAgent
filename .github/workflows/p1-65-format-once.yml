name: P1 #65 isolated format preparation
on:
  push:
    branches:
      - fix/p1-65-smtp-mysql57-style
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/p1-65-smtp-mysql57-style'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize all Java files
        run: |
          python3 scripts/p1-normalize-style.py
          mvn -B -f backend/pom.xml spotless:apply
          python3 scripts/check-java-style.py
          mvn -B -f backend/pom.xml -DskipTests compile
      - name: Format frontend with locked Prettier
        working-directory: frontend
        run: |
          npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund prettier@3.6.2
          npm run format
          npm run format:check
          npm run build
      - name: Commit formatted sources only to the isolated branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/p1-65-smtp-mysql57-style
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style(p1): format Java and Vue sources; complete type documentation"
            git push origin HEAD:refs/heads/fix/p1-65-smtp-mysql57-style
          fi
