<!doctype html>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23176B62'/%3E%3Cpath d='M20 20h15a12 12 0 0 1 0 24H20V20Zm24 0v24' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var appearance = JSON.parse(localStorage.getItem('peachagent-appearance-v1') || '{}');
        var themes = ['editorial-light', 'obsidian-dark', 'nordic-slate'];
        document.documentElement.dataset.theme = themes.includes(appearance.theme) ? appearance.theme : 'editorial-light';
        document.documentElement.lang = appearance.locale === 'en-US' ? 'en-US' : 'zh-CN';
      } catch (_) { document.documentElement.dataset.theme = 'editorial-light'; }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="builder.css">

<body>
  <a class="skip-link" href="#page-content">跳转到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航"></aside>

      <main id="page-content" tabindex="-1"></main>
      <footer class="app-footer"><span><i class="tiny-dot"></i> 本地演示已就绪</span><span>OTRYX Studio <span class="footer-sep">/</span> 本地交互原型</span><button type="button" data-action="help">交互指南</button></footer>
    </div>
  </div>
  <dialog id="app-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>
