  function conversation(){const a=agentFor(S.params.agent);if(!a)return {a:null,messages:[]};S.session.messages[a.id]=S.session.messages[a.id]||[];return {a,messages:S.session.messages[a.id]};}
  function planMarkup(goal,agentId){return `<div class="panel panel-pad" style="margin-top:14px"><div class="between"><h3 style="font-size:13px">建议的执行计划</h3>${S.badge('等待开始','info')}</div>${[['明确交付边界','整理目标、参考资料与输出格式。'],['检索与分析','使用知识库和工具，汇总事实与关键发现。'],['确认内容','展示结构与结论，等待你的确认。'],['生成交付物','输出报告和行动清单，记录本次运行。']].map(([title,desc],i)=>`<div class="plan-step"><b>${i+1}</b><div><strong>${title}</strong><p>${desc}</p></div></div>`).join('')}<div class="row" style="margin-top:17px">${S.btn('按计划开始执行','chat-execute',{icon:'play',attrs:`data-goal="${e(goal)}" data-agent="${e(agentId)}" data-model="${e(S.params.model||'')}"`})}${S.btn('调整计划','chat-adjust',{variant:'secondary'})}</div></div>`;}
  S.page('chat',{title:'智能体对话',section:'开始创造',render(){const {a,messages}=conversation();if(!a)return S.empty('先创建一个智能体','为你的工作选择一个搭档。',S.btn('创建智能体','new-agent'));const mode=S.params.mode||'chat';return `<div class="chat-layout"><div class="chat-title">${avatar(a)}<div style="flex:1"><h1>${e(a.name)}</h1><p class="small muted">${e(S.params.model||a.model)} · ${e(a.version)} · 本地演示会话</p></div>${S.btn('新会话','new-conversation',{variant:'secondary',icon:'plus',small:true})}<a class="icon-btn" href="#agent?id=${encodeURIComponent(a.id)}" aria-label="配置智能体">${S.icon('settings',18)}</a></div><div class="chat-context">${S.icon('book',13)}<span>${e(a.knowledge||'暂无知识库')}</span><span>·</span><span>${a.tools.length} 项工具</span><span>·</span><span>关键操作需确认</span></div><div class="chat-messages" id="chat-messages">${messages.length?messages.map((m,i)=>`<article class="chat-message ${m.role==='user'?'user':'assistant'}">${m.role==='user'?'<span class="avatar">H</span>':avatar(a)}<div style="min-width:0;flex:1"><div class="message-meta">${m.role==='user'?'你':e(a.name)} ${m.status==='streaming'?'· 正在整理':m.status==='cancelled'?'· 已停止':''}</div><div class="message-body" ${m.status==='streaming'?'id="stream-content"':''}>${e(m.content)||'<span class="typing-dots" aria-label="正在生成"><i></i><i></i><i></i></span>'}</div>${m.status==='done'&&m.type==='plan'?planMarkup(m.goal,a.id):''}${m.role==='assistant'&&m.status==='done'?`<div class="chat-tools">${S.btn('复制','copy-message',{variant:'ghost',icon:'copy',small:true,attrs:`data-index="${i}"`})}${S.btn('保存笔记','save-message',{variant:'ghost',icon:'download',small:true,attrs:`data-index="${i}"`})}<span class="small muted" style="font-size:10px;align-self:center">演示输出 · ${m.content.length*2} Tokens</span></div>`:''}${m.status==='cancelled'?S.btn('重新生成','retry-message',{variant:'ghost',small:true,icon:'refresh'}):''}</div></article>`).join(''):`<div class="preview-agent" style="padding:45px 20px">${avatar(a,'width:58px;height:58px;border-radius:18px')}<h2 style="font-size:24px;margin:6px 0 12px">一起把事情，向前推进。</h2><p>描述一个目标，或者从下面的示例开始。</p><div class="prompt-shortcuts" style="justify-content:center;margin-top:22px">${S.btn('制定研究计划','chat-starter',{variant:'secondary',icon:'globe',attrs:'data-id="research"'})}${S.btn('整理工作周报','chat-starter',{variant:'secondary',icon:'file',attrs:'data-id="report"'})}</div></div>`}</div><form class="chat-composer" id="chat-form" novalidate><label for="chat-input" class="field-label" style="position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden">发送消息</label><textarea id="chat-input" placeholder="继续描述你的想法…" style="resize:none">${e(S.session.chatDraft||'')}</textarea><div class="composer-bottom"><div class="row"><div class="mode-pill">${[['chat','对话'],['plan','规划']].map(([id,label])=>`<button type="button" data-action="chat-mode" data-id="${id}" class="${mode===id?'active':''}" aria-pressed="${mode===id}">${label}</button>`).join('')}</div><span class="small muted" style="font-size:10px">Enter 发送 · Shift + Enter 换行</span></div>${S.session.streaming?S.btn('停止生成','stop-message',{variant:'secondary',icon:'stop',small:true}):S.btn('发送','send-message',{icon:'arrow',small:true})}</div></form></div>`;},mount(root){const input=root.querySelector('#chat-input');if(!input)return;input.addEventListener('input',()=>S.session.chatDraft=input.value);input.addEventListener('keydown',ev=>{if(ev.isComposing||ev.keyCode===229)return;if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();S.actions['send-message']();}});root.querySelector('#chat-form').addEventListener('submit',ev=>ev.preventDefault());if(S.session.pendingMessage){const pending=S.session.pendingMessage;S.session.pendingMessage=null;queueMicrotask(()=>send(pending.text,pending.mode));}}});
  function send(text,forcedMode,retry=false){const {a,messages}=conversation();if(!a||S.session.streaming)return;const input=document.getElementById('chat-input');const content=(text??input?.value??'').trim();if(!content){input?.focus();return;}if(!retry)messages.push({role:'user',content,status:'done'});S.session.lastGoal=content;S.session.chatDraft='';const mode=forcedMode||S.params.mode||'chat';const answer=mode==='plan'?`我会围绕「${content}」来组织这项工作。\n\n先明确资料与交付要求，再依次完成检索、分析和内容整理。涉及对外操作时，我会暂停并请你确认。\n\n下面的计划可以直接开始执行，也可以继续调整。`:`我已收到你的目标：「${content}」。\n\n建议先把工作整理成三个部分：\n\n一、明确输入。收集已有资料，确认需要回答的问题和最终交付格式。\n\n二、形成结论。结合知识库与可用工具分析信息，区分已确认的事实和仍需核实的判断。\n\n三、交付下一步。将结果整理为清晰的报告与行动清单；需要人工决定的事项单独标注。\n\n你可以补充参考材料，或者切换到规划模式，生成完整执行计划。`;
    const msg={role:'assistant',content:'',status:'streaming',type:mode==='plan'?'plan':'text',goal:content};messages.push(msg);S.session.streaming={agent:a.id,msg,answer,position:0};S.render();let position=0;const timer=setInterval(()=>{if(!S.session.streaming||S.session.streaming.msg!==msg){clearInterval(timer);return;}position=Math.min(answer.length,position+8);msg.content=answer.slice(0,position);const target=document.getElementById('stream-content');if(target)target.textContent=msg.content;if(position>=answer.length){clearInterval(timer);msg.status='done';S.session.streaming=null;if(S.route==='chat'){S.render();const chatInput=document.getElementById('chat-input');if(chatInput)chatInput.focus({preventScroll:true});}}},35);S.session.streamTimer=timer;
  }
  S.action('send-message',()=>send());S.action('chat-starter',el=>send(presets[el.dataset.id],'plan'));
  S.action('stop-message',()=>{if(!S.session.streaming)return;clearInterval(S.session.streamTimer);S.session.streaming.msg.status='cancelled';if(!S.session.streaming.msg.content)S.session.streaming.msg.content='这次生成已停止。';S.session.streaming=null;S.render();S.toast('已停止生成，已生成的内容保留','info');});
  S.action('retry-message',()=>send(S.session.lastGoal,S.params.mode||'chat',true));
  S.action('chat-mode',el=>S.go('chat',{agent:S.params.agent||'research',mode:el.dataset.id,...(S.params.model?{model:S.params.model}:{})}));
  S.action('chat-execute',el=>{const goal=el.dataset.goal||'新的研究任务';const run=S.startRun({title:goal.length>32?goal.slice(0,32)+'…':goal,agent:el.dataset.agent||S.params.agent,source:'智能体计划',model:el.dataset.model||undefined});run.goal=goal;run.references=[...(S.session.attachments||[])];S.save();});
  S.action('chat-adjust',()=>{const input=document.getElementById('chat-input');input.value='请调整计划：';S.session.chatDraft=input.value;input.focus();input.scrollIntoView({behavior:'smooth',block:'center'});});
  S.action('new-conversation',()=>{if(S.session.streaming)S.actions['stop-message']();const {a,messages}=conversation();S.session.archived=S.session.archived||[];if(messages.length)S.session.archived.push({agent:a.id,messages:[...messages]});S.session.messages[a.id]=[];S.session.chatDraft='';S.render();S.toast('新会话已开始');});
  S.action('copy-message',el=>{const {messages}=conversation();return S.copy(messages[+el.dataset.index]?.content||'');});
  S.action('save-message',el=>{const {a,messages}=conversation();const msg=messages[+el.dataset.index];if(!msg)return;S.download(a.name+'-笔记.md','# '+a.name+'\n\n> OTRYX Studio 本地演示会话\n\n'+msg.content,'text/markdown');S.toast('笔记已生成，可在下载文件中查看');});
})();

  <script>

  const byId = id => R.flows.find(flow => flow.id === id);

  const selected = () => { const d=draft(); if(d&&S.params.node&&d.nodes.some(n=>n.id===S.params.node)&&ui.lastParamNode!==S.params.node){ui.selected[d.id]=S.params.node;ui.lastParamNode=S.params.node;} return d && (d.nodes.find(n=>n.id===ui.selected[d.id]) || d.nodes.find(n=>n.type==='mcp') || d.nodes[0]); };
  const attrs = (id,more='') => `data-id="${E(id)}" ${more}`;

  const code = value => `<pre class="builder-code">${E(typeof value==='string'?value:JSON.stringify(value,null,2))}</pre>`;
  const statusNames = {running:['执行中','info'],waiting:['等待处理','warning'],done:['已完成','success'],failed:['执行失败','danger'],stopped:['已停止','neutral'],rejected:['已拒绝','danger'],skipped:['未执行','neutral'],pending:['未开始','neutral'],paused:['断点暂停','warning']};
  const statusBadge = value => {const state=statusNames[value]||[value||'未开始','neutral'];return S.badge(state[0],state[1]);};
  const when = value => value ? new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value)) : '尚未运行';

  function error(message,element) {const target=document.getElementById('builder-inline-error');if(target){target.textContent=message;target.hidden=!message;}if(element){element.setAttribute('aria-invalid',message?'true':'false');if(message)element.focus();}if(message)S.toast(message,'error');}
  function schemaProps(schema) {if(!schema)return {};return schema.properties || schema;}

  }
  function nodeSchema(node,output=false) {
    const meta=def(node.type);
    if(['mcp','plugin'].includes(node.type)){const tool=R.getTool(node.config.toolId);return tool?(output?{result:{type:'object',properties:tool.outputSchema.properties||{}}}:tool.inputSchema):{type:'object',properties:{}};}
    return output ? meta.outputs : meta.inputs;
  }
  const graphLabel = flow => {const types=flow.nodes.map(n=>n.type);return types.includes('artifact')?'文件与运行结果':types.includes('output')&&flow.nodes.find(n=>n.type==='output')?.config.mode==='data'?'结构化返回':types.includes('plugin')||types.includes('mcp')?'动作执行 · 按节点记录结果':'完成即可 · 无强制返回';};
  function card(flow) {

    const groups=[...new Set(flow.nodes.map(n=>def(n.type).group))].filter(Boolean);
    return `<article class="panel builder-flow-card"><div class="between"><span class="builder-flow-emblem">${S.icon('workflow',23)}</span><div class="row gap">${S.badge(published?'发布版 v'+flow.publishedSnapshot.version:'草稿',published?'success':'neutral')}${dirty?S.badge('有修改','warning'):''}</div></div><h2><a href="#workflow?id=${encodeURIComponent(flow.id)}">${E(flow.title)}</a></h2><p>${E(flow.description||'把模型、工具与判断组合成可复用的工作方法。')}</p><div class="builder-flow-chain" aria-label="节点概览">${flow.nodes.slice(0,7).map((n,i)=>`${i?'<span class="builder-chain-line"></span>':''}<span title="${E(n.title)}">${S.icon(def(n.type).icon,16)}</span>`).join('')}${flow.nodes.length>7?`<small>+${flow.nodes.length-7}</small>`:''}</div><div class="builder-flow-tags">${groups.slice(0,3).map(g=>`<span>${E(g)}</span>`).join('')}</div><div class="builder-flow-meta"><span>${flow.nodes.length} 个节点 · ${(flow.edges||[]).length} 条连线</span><span>${E(graphLabel(flow))}</span></div><footer><a class="btn btn-secondary btn-sm" href="#workflow?id=${encodeURIComponent(flow.id)}">${S.icon('edit',14)}编辑流程</a><div class="row gap">${button('复制','builder-copy-flow',{variant:'ghost',attrs:attrs(flow.id)})}${button(published?'运行发布版':'运行草稿','builder-run-flow',{variant:'primary',icon:'play',attrs:attrs(flow.id,`data-mode="${published?'published':'saved'}"`)})}</div></footer></article>`;

  }
  function field(label,key,value,options={}) {
    const id='builder-field-'+(selected()?.id||'node')+'-'+key.replace(/[^\w-]/g,'-');const name=options.name||key;const data=`data-builder-field="${E(key)}" data-field-kind="${E(options.type||'text')}" aria-describedby="${id}-error"`;let input='';
    if(options.type==='checkbox')input=`<label class="builder-check"><input type="checkbox" id="${id}" ${data} ${value?'checked':''}>${E(label)}</label>`;

  function bindingControl(name,binding,schema={},prefix='bindings') {

  <script>

  function usageData(days) {

    const dayData = Array.from({ length: days }, (_, i) => { const date = new Date(base); date.setUTCDate(base.getUTCDate() - days + i + 1); const n = 30 - days + i; return { date, label: dayText(date), tokens: 15000 + ((n * 7919 + 4337) % 42000), cost: Number((0.85 + ((n * 37 + 19) % 185) / 100).toFixed(2)), runs: 3 + n % 7 }; });

例记录' : '汇总当前日期范围内的演示记录'}</p></div>${S.tabs([{ id: 'model', label: '按模型' }, { id: 'agent', label: '按 Agent' }, { id: 'task', label: '按任务' }], group, 'gov-group')}</div><div class="table-wrap"><table class="data-table"><thead><tr>${group === 'task' ? '<th>任务 / 来源</th><th>模型</th><th>日期</th>' : `<th>${group === 'model' ? '模型' : 'Agent'}</th><th>记录数</th><th>用量占比</th>`}<th class="gov-num">Token</th><th class="gov-num">模拟费用</th></tr></thead><tbody>${visible.map(row => group === 'task' ? `<tr><td><strong>${E(row.title)}</strong><div class="small muted">${E(row.agent)} · ${E(row.status)}</div></td><td>${E(row.model)}</td><td class="mono">${row.date}</td><td class="gov-num mono">${number(row.tokens)}</td><td class="gov-num mono">${money(row.cost)}</td></tr>` : `<tr><td><span class="gov-table-identity"><span class="gov-model-dot">${S.icon(group === 'model' ? 'box' : 'agent', 16)}</span><strong>${E(row.name)}</strong></span></td><td class="mono">${row.count}</td><td><div class="gov-share"><span style="width:${Math.max(2, row.tokens / data.tokens * 100)}%"></span></div><span class="small muted">${(row.tokens / data.tokens * 100).toFixed(1)}%</span></td><td class="gov-num mono">${number(row.tokens)}</td><td class="gov-num mono">${money(row.cost)}</td></tr>`).join('')}</tbody></table></div><div class="gov-table-footer"><span class="small muted">共 ${rows.length} ${group === 'task' ? '条记录' : '项'} · 第 ${page} / ${Math.ceil(rows.length / 8) || 1} 页</span><div class="row">${S.btn('上一页', 'gov-usage-page', { variant: 'secondary', small: true, attrs: `data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}` })}${S.btn('下一页', 'gov-usage-page', { variant: 'secondary', small: true, attrs: `data-page="${page + 1}" ${page * 8 >= rows.length ? 'disabled' : ''}` })}</div></div></section><p class="gov-footnote">${S.icon('help', 14)} 原型中的费用使用固定示例估算，仅用于展示产品交互，不代表任何服务商的实际价格。</p></div>`;

con: 'download', attrs: 'data-file="readme"' })}</div></section></div>`;

{encodeURIComponent(run.id)}&tab=trace" class="text-link">查看完整调用链 ${S.icon('arrow',12)}</a></div>${(run.toolCalls||[]).slice(-3).map(c=>toolCard(run,c,true)).join('')||`<p class="muted">${run.status==='waiting'?'等待你处理上方确认。':'节点正在按配置执行，完成后按实际结果展示。'}</p>`}</section>`:''}${['stopped','rejected'].includes(run.status)?`<section class="panel panel-pad"><h3>${run.status==='stopped'?'运行已停止':'本次操作已拒绝'}</h3><p class="muted">已有执行记录和回执保留。停止或拒绝不会撤销先前已完成的操作。</p></section>`:''}`:tab==='trace'?trace(run):tab==='io'?`<div class="grid-2"><section class="panel panel-pad"><h3>运行输入</h3>${json(run.inputs||{goal:run.goal,references:run.references})}</section><section class="panel panel-pad"><h3>冻结的配置快照</h3><p class="field-help">历史运行使用启动时的配置。后续编辑不会改写这份记录。</p>${json(run.snapshot||run.workflowSnapshot||run.agentSnapshot||{version:run.version})}</section></div>`:tab==='events'?events(run):usage(run)}</div></div>`;

  S.action('run-export',el=>{const run=R.findRun(el.dataset.id);if(run)S.download(run.id+'.json',JSON.stringify(run,null,2),'application/json');});

})();

  <script>
/* agent-studio.js */
(function () {
  'use strict';

  function basic(a,d){return `<section class="panel as-config-card"><div class="as-section-head"><div><h2>身份与模型</h2><p>定义职责、工作方式与模型配置。</p></div>${avatar(a)}</div><form id="as-editor-form" data-form="as-save" novalidate><div class="grid-2">${S.field('智能体名称',{id:'as-name',name:'name',value:d.name,required:true})}<div class="field"><label class="field-label" for="as-model">对话模型</label><select class="select" id="as-model" name="model" data-as-field="model">${[...new Set([d.model,...S.state.models.map(m=>m.name)])].map(m=>`<option ${m===d.model?'selected':''}>${E(m)}</option>`).join('')}</select></div></div>${S.field('职责描述',{id:'as-description',name:'description',value:d.description})}<div class="field"><label class="field-label" for="as-prompt">工作指引 <span class="required-star">*</span></label><textarea class="textarea as-prompt" id="as-prompt" name="prompt" style="resize:none" aria-describedby="as-prompt-error">${E(d.prompt)}</textarea><p class="field-error" id="as-prompt-error"></p><p class="field-help">说明什么时候读取资料、什么时候调用工具、何时应向你确认。</p></div><div class="grid-2"><div class="field"><label class="field-label" for="as-temperature">创造性 · ${d.temperature??.4}</label><input type="range" id="as-temperature" name="temperature" min="0" max="1" step="0.1" value="${d.temperature??.4}" class="as-range"></div><div class="as-model-contract"><span>${S.icon('check',14)} Tool calling · 演示适配</span><span>${S.icon('check',14)} 结构化输出 · 演示适配</span></div></div></form></section>`;}
  function capabilities(a,d){return `<section class="panel as-config-card"><div class="as-section-head"><div><h2>工具与上下文</h2><p>绑定具体动作，每个工具保留独立连接与权限。</p></div>${S.btn('添加能力','as-add-capability',{icon:'plus',attrs:'data-target="draft"'})}</div><div class="as-subhead"><h3>MCP 与插件工具</h3><span>${d.capabilityBindings.length} 项绑定</span></div><div class="as-tool-list">${d.capabilityBindings.map(b=>bindingTile(b,'draft',true)).join('')||S.empty('给它添加第一项能力','从 MCP 或插件中选择具体工具。',S.btn('选择工具','as-add-capability',{variant:'secondary',attrs:'data-target="draft"'}))}</div><div class="as-subhead as-subhead-spaced"><h3>资源、Prompt、Skill 与工作流</h3>${S.btn('添加上下文','as-add-context',{variant:'ghost',small:true,icon:'plus',attrs:'data-target="draft"'})}</div>${contextTiles(d,'draft')}<div class="as-inline-note">${S.icon('link',16)}<span>安装资源后仍需绑定到 Agent。启用连接、发布配置和单次会话设置分别生效。</span></div></section>`;}

  function contextTiles(target,scope){return `<div class="as-context-list">${(target.contextBindings||[]).map((b,i)=>{const d=contextDef(b);return `<div class="as-context-tile"><span class="as-cap-icon">${S.icon({resource:'book',prompt:'code',skill:'spark',workflow:'workflow',agent:'agent'}[b.kind],17)}</span><div><strong>${E(titleOf(d))}</strong><span>${E({resource:'MCP 资源',prompt:'提示词模板',skill:'Skill 指引',workflow:'已发布工作流',agent:'子 Agent'}[b.kind])} · ${E(b.version||d?.version||'默认')}</span></div>${S.btn('移除','as-remove-context',{variant:'ghost',small:true,attrs:`data-index="${i}" data-target="${scope}"`})}</div>`;}).join('')||'<p class="as-empty-note">尚未绑定额外上下文。可选择资源、参数化提示词、Skill 或已发布工作流。</p>'}</div>`;}
  function knowledge(a,d){const names=[...new Set([d.knowledge,...(S.state.ecoAssets||[]).filter(x=>x.type==='knowledge').map(x=>x.name),'研究资料室','Peach Cloud 工程文档'])].filter(Boolean);return `<section class="panel as-config-card"><div class="as-section-head"><div><h2>知识与记忆</h2><p>设定默认上下文和记忆写入方式。</p></div>${S.icon('book',24)}</div><div class="field"><label class="field-label" for="as-knowledge">参考知识库</label><select class="select" id="as-knowledge" data-as-field="knowledge"><option value="">不使用知识库</option>${names.map(n=>`<option ${n===d.knowledge?'selected':''}>${E(n)}</option>`).join('')}</select></div><div class="as-setting-row"><div><strong>读取已有记忆</strong><p>本地会话中可引用已保存的偏好条目。</p></div><label class="switch"><input type="checkbox" data-as-memory="read" aria-label="读取已有记忆" ${d.memoryPolicy?.read!==false?'checked':''}><span></span></label></div><div class="field"><label class="field-label" for="as-memory-write">记忆写入策略</label><select class="select" id="as-memory-write" data-as-memory="write">${[['ask','每次询问'],['off','不写入'],['session','仅本次会话']].map(([v,l])=>`<option value="${v}" ${d.memoryPolicy?.write===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="as-knowledge-sample"><span class="eyebrow">已保存的上下文</span>${(S.state.agentMemory||[]).filter(m=>m.agentId===a.id).map(m=>`<div class="as-memory-row"><p>${E(m.content)}</p><span class="small muted">${E(m.scope==='session'?'会话':'空间')}记忆</span></div>`).join('')||'<p class="small muted">还没有保存记忆。对话结束后，可主动将一条结论存为记忆。</p>'}</div></section>`;}
  function policies(a,d){const p={...policyDefault,...d.executionPolicy};return `<section class="panel as-config-card"><div class="as-section-head"><div><h2>执行边界</h2><p>让工具调用和模型继续执行有明确的上限。</p></div>${S.icon('shield',24)}</div><div class="grid-2"><div class="field"><label class="field-label" for="as-tool-mode">工具选择</label><select class="select" id="as-tool-mode" data-as-policy="toolMode">${[['auto','自动选择已启用工具'],['required','指定一个工具'],['none','禁用工具调用']].map(([v,l])=>`<option value="${v}" ${p.toolMode===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label class="field-label" for="as-forced-tool">指定工具</label><select class="select" id="as-forced-tool" data-as-policy="forcedToolId"><option value="">请选择</option>${d.capabilityBindings.filter(b=>b.enabled!==false).map(b=>`<option value="${E(b.toolId)}" ${p.forcedToolId===b.toolId?'selected':''}>${E(titleOf(R.getTool(b.toolId)))}</option>`).join('')}</select></div>${[['maxRounds','最大工具轮次',1,20],['maxTokens','Token 预算',100,100000],['maxCost','费用预算（演示元）',.01,1000],['timeoutMs','总时限（毫秒）',1000,300000]].map(([key,label,min,max])=>`<div class="field"><label class="field-label" for="as-policy-${key}">${label}</label><input class="input" id="as-policy-${key}" type="number" min="${min}" max="${max}" step="${key==='maxCost'?.01:1}" value="${E(p[key])}" data-as-policy="${key}"><p class="field-help">范围 ${min} – ${max}</p></div>`).join('')}</div><div class="as-policy-explainer">${S.icon('shield',19)}<div><strong>写入操作始终需要确认</strong><p>原型会在写入指定位置之前展示实参，确认一次后继续。读取操作可设置“每次确认”。</p></div></div><div class="as-inline-note">${S.icon('help',16)}<span>本轮固定串行执行工具，保留最大轮次、预算与超时约束。真实并行调度由后端执行器接入。</span></div></section>`;}
  function testing(a,d){const latest=S.state.runs.filter(r=>r.kind==='agent'&&(r.agentSnapshot?.id===a.id||r.snapshot?.id===a.id)).slice(0,5);return `<section class="panel as-config-card"><div class="as-section-head"><div><h2>测试与验证</h2><p>在对话中验证工具可用性、确认边界和失败恢复。</p></div>${S.badge('本地适配器','info')}</div><div class="as-test-scenarios">${[['检索并总结','检索企业 Agent 的发展方向，给出三个关键发现。','search'],['写入指定位置','研究 Agent 工作流，把结论写入 /知识库/行业观察。','write'],['空结果分支','检索一个没有匹配结果的话题，说明没有结果的情况。','empty']].map(([title,prompt,id])=>`<button type="button" class="as-test-card" data-action="as-test-scenario" data-id="${id}" data-prompt="${E(prompt)}"><span>${S.icon(id==='write'?'folder':id==='empty'?'filter':'search',20)}</span><strong>${title}</strong><p>${E(prompt)}</p>${S.icon('arrow',14)}</button>`).join('')}</div><div class="as-subhead as-subhead-spaced"><h3>最近 Agent 运行</h3><a href="#tasks" class="text-link">全部记录</a></div>${latest.map(r=>`<a class="as-run-link" href="#task?id=${encodeURIComponent(r.id)}"><span>${E(r.title)}<small>${E(r.version)} · ${(r.toolCalls||[]).length} 次工具调用</small></span>${U.status(r.status)}${S.icon('arrow',13)}</a>`).join('')||'<p class="as-empty-note">开始一次完整对话后，这里会保留独立运行记录。</p>'}</section>`;}
  function versions(a,d){return `<section class="panel as-config-card"><div class="as-section-head"><div><h2>版本与快照</h2><p>保存草稿用于继续编辑，发布版本用于后续新会话。</p></div>${S.badge(a.publishedConfig?'已发布 '+a.version:'尚未发布',a.publishedConfig?'success':'neutral')}</div><div class="as-version-table">${(a.history?.length?a.history:[{version:a.version,time:a.updated,note:a.publishedConfig?'当前发布版本':'初始草稿'}]).map(v=>`<div><span class="as-version-dot"></span><strong class="mono">${E(v.version)}</strong><p>${E(v.note||'配置更新')}</p><span class="small muted">${E(v.time||'刚刚')}</span></div>`).join('')}</div><details class="as-snapshot"><summary>查看当前发布配置</summary>${U.json(a.publishedConfig||{message:'还没有发布'})}</details><p class="as-inline-note">正在运行的任务使用启动时的配置；连接禁用和当前权限检查仍即时生效。</p></section>`;}
  S.page('agent',{title:'智能体工作台',section:'开始创造',render(){

  },mount(root){

  function save(publish){const a=agentNow(),d=draft(a);if(!validateDraft(a,d))return;const oldPublished=a.publishedConfig?clone(a.publishedConfig):null;const clean=cleanConfig(d);Object.assign(a,clean);a.name=a.name.trim();a.updated='刚刚';a.publishedConfig=oldPublished;a.status='draft';if(publish){const parts=(a.version||'0.1.0').split('.').map(Number);parts[2]=(parts[2]||0)+1;a.version=parts.join('.');a.status='published';a.publishedConfig=clone({...clean,id:a.id,version:a.version,status:'published'});a.publishedPrompt=a.prompt;a.publishedVersions=a.publishedVersions||[];a.publishedVersions.unshift(cleanConfig(a.publishedConfig));a.history=a.history||[];a.history.unshift({version:a.version,time:'刚刚',note:'模型、工具绑定与执行边界更新'});}delete ui.drafts[a.id];S.setDirty(false);S.save();S.render();S.toast(publish?'已发布 '+a.version+'，新会话可使用新配置':'草稿已保存');}

    return `<article class="as-message ${m.role==='user'?'is-user':''}">${m.role==='user'?'<span class="as-message-avatar">H</span>':avatar(a)}<div class="as-message-main"><div class="as-message-meta"><strong>${m.role==='user'?'你':E(a.name)}</strong>${run?`<span>${E(run.version)} · ${E(run.model)}</span>${U.status(run.status)}`:''}</div>${content?`<div class="as-message-text">${E(content)}</div>`:run?`<div class="as-working">${S.icon(run.status==='waiting'?'shield':'spark',16)}<span>${run.status==='waiting'?'等待确认后继续':run.activeChildRunId?'正在执行已绑定的工作流或子 Agent':'正在处理目标与工具结果'}</span></div>`:''}${run?.plan?`<div class="as-plan"><h3>执行计划</h3>${run.plan.steps.map((step,index)=>`<div class="as-plan-step"><span>${index+1}</span><div><strong>${E(step.title)}</strong><p>${step.requiresApproval?'写入前暂停，展示目标与参数':'读取已授权信息'}</p></div>${step.requiresApproval?S.icon('shield',15):S.icon('plug',15)}</div>`).join('')||'<p class="small muted">尚未启用工具，可先在右侧选择本次能力。</p>'}${S.btn('开始执行此计划','as-execute-plan',{icon:'play',attrs:`data-run="${E(run.id)}" data-message="${E(m.id)}" ${busy(session)?'disabled':''}`})}</div>`:''}${(run?.toolCalls||[]).map(c=>U.toolCard(run,c,true)).join('')}${run?U.approval(run,'chat'):''}${run?.activeChildRunId?`<div class="as-child-run"><span>${S.icon('workflow',18)} 已调用子运行</span><a href="#task?id=${encodeURIComponent(run.activeChildRunId)}" class="btn btn-secondary btn-sm">${R.findRun(run.activeChildRunId)?.status==='waiting'?'处理子运行确认':'查看子运行'} ${S.icon('arrow',12)}</a></div>`:''}${run?.outcome.receipts?.length?`<div class="as-inline-receipts">${run.outcome.receipts.map(r=>`<span>${S.icon('folder',13)} ${E(r.destination)}</span>`).join('')}<small>模拟写入 · 无需另外生成文件</small></div>`:''}${m.role==='assistant'&&run&&!['running','waiting'].includes(run.status)?`<div class="as-message-actions">${S.btn('复制','as-copy-message',{variant:'ghost',small:true,icon:'copy',attrs:`data-index="${i}"`})}${S.btn('存为记忆','as-save-memory',{variant:'ghost',small:true,icon:'book',attrs:`data-index="${i}"`})}<a class="btn btn-ghost btn-sm" href="#task?id=${encodeURIComponent(run.id)}&tab=trace">${S.icon('workflow',12)}调用链</a>${['failed','stopped','rejected'].includes(run.status)?S.btn('重新尝试','as-retry-message',{variant:'ghost',small:true,icon:'refresh',attrs:`data-run="${E(run.id)}"`}):''}</div>`:''}</div></article>`;
  }).join(''):`<div class="as-chat-welcome"><span class="as-welcome-symbol">${S.icon('agent',33)}</span><span class="eyebrow">WORK WITH YOUR INTELLIGENCE</span><h2>从一句话，开始一起工作。</h2><p>读取资料，调用工具，或把结果放到指定位置。<br>每一次执行都可以追溯。</p><div class="as-chat-suggestions">${[['globe','检索并总结 Agent 平台的最新方向。'],['folder','研究 Agent 工作流，把结论写入 /知识库/行业观察。'],['workflow','先规划一个资料整理与归档的任务。']].map(([icon,text])=>`<button type="button" data-action="as-chat-example" data-text="${E(text)}" data-mode="${icon==='workflow'?'plan':'chat'}">${S.icon(icon,18)}<span>${E(text)}</span>${S.icon('arrow',13)}</button>`).join('')}</div></div>`;}
  function capabilityPanel(a,session){const snap=savedConfig(a),enabled=session.capabilityBindings.filter(b=>b.enabled!==false),run=[...session.messages].reverse().map(m=>m.runId&&R.findRun(m.runId)).find(Boolean);return `<aside class="as-chat-capabilities" aria-label="本次能力与执行"><div class="as-cap-heading"><div><h2>本次能力</h2><p>会话设置 · 下一轮生效</p></div>${S.btn('选择','as-add-capability',{variant:'ghost',small:true,icon:'plus',attrs:'data-target="session"'})}</div><div class="as-chat-cap-section"><div class="as-subhead"><h3>工具</h3><span>${enabled.length} 项启用</span></div>${session.capabilityBindings.map(b=>bindingTile(b,'session',false)).join('')||'<p class="as-empty-note">未绑定工具，仍可进行对话。</p>'}</div><div class="as-chat-cap-section"><div class="as-subhead"><h3>上下文与工作流</h3>${S.btn('添加','as-add-context',{variant:'ghost',small:true,attrs:'data-target="session"'})}</div>${contextTiles(session,'session')}</div><div class="as-chat-cap-section"><div class="field"><label class="field-label" for="as-chat-model">对话模型</label><select class="select" id="as-chat-model">${S.state.models.map(m=>`<option ${m.name===session.model?'selected':''}>${E(m.name)}</option>`).join('')}</select></div><div class="field"><label class="field-label" for="as-chat-tool-mode">工具选择</label><select class="select" id="as-chat-tool-mode">${[['auto','自动选择'],['required','指定工具'],['none','禁用调用']].map(([v,l])=>`<option value="${v}" ${session.toolMode===v?'selected':''}>${l}</option>`).join('')}</select></div>${session.toolMode==='required'?`<div class="field"><label class="field-label" for="as-chat-forced">指定工具</label><select class="select" id="as-chat-forced"><option value="">请选择工具</option>${enabled.map(b=>`<option value="${E(b.toolId)}" ${session.forcedToolId===b.toolId?'selected':''}>${E(titleOf(R.getTool(b.toolId)))}</option>`).join('')}</select></div>`:''}${session.contextBindings.some(b=>['workflow','agent'].includes(b.kind))?`<div class="field"><label class="field-label" for="as-chat-context-call">本轮调用对象</label><select class="select" id="as-chat-context-call"><option value="">由 Agent 使用工具处理</option>${session.contextBindings.filter(b=>['workflow','agent'].includes(b.kind)).map(b=>`<option value="${E(b.kind+':'+b.id)}" ${session.contextCall===b.kind+':'+b.id?'selected':''}>${E(titleOf(contextDef(b)))}</option>`).join('')}</select></div>`:''}<div class="field"><label class="field-label" for="as-chat-destination">默认写入位置</label><input class="input" id="as-chat-destination" value="${E(session.destination)}"></div><details class="as-chat-debug"><summary>调试本轮调用</summary><div class="field"><label class="field-label" for="as-chat-scenario">测试场景</label><select class="select" id="as-chat-scenario">${[['success','成功响应'],['empty','空结果'],['tool_error','工具错误'],['timeout','超时'],['schema_error','输出结构不匹配']].map(([v,l])=>`<option value="${v}" ${session.scenario===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label class="field-label" for="as-chat-args">覆盖工具实参（JSON）</label><textarea class="textarea mono" id="as-chat-args" style="resize:none" rows="5" placeholder="留空时从目标生成示例实参">${E(session.argsText||'')}</textarea><p class="field-help">建议配合“指定工具”使用，参数将按工具 Schema 校验。</p></div></details></div><div class="as-chat-cap-section"><div class="as-subhead"><h3>执行边界</h3><a href="#agent?id=${encodeURIComponent(a.id)}" class="text-link">配置</a></div><div class="as-budget-list"><span>模型 <strong>${E(session.model||snap.model)}</strong></span><span>工具轮次 <strong>${snap.executionPolicy.maxRounds}</strong></span><span>Token 上限 <strong>${snap.executionPolicy.maxTokens.toLocaleString()}</strong></span><span>写入操作 <strong>执行前确认</strong></span></div>${run?`<a class="as-last-run" href="#task?id=${encodeURIComponent(run.id)}&tab=trace">${S.icon('workflow',16)}<span>本轮调用链<small>${(run.toolCalls||[]).length} 次工具调用 · ${Number(run.tokens||0)} 估算 Token</small></span>${S.icon('arrow',13)}</a>`:''}</div><div class="as-cap-footer">${S.btn('将会话能力存为草稿','as-session-to-draft',{variant:'secondary',small:true,icon:'edit'})}${S.btn('恢复发布配置','as-reset-session',{variant:'ghost',small:true,icon:'refresh'})}</div></aside>`;}
  function refreshChat(){if(S.route!=='chat')return;const active=document.activeElement,id=active?.id,start=active?.selectionStart,end=active?.selectionEnd;const scroll=document.getElementById('as-message-scroll'),near=scroll?scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<100:true,top=scroll?.scrollTop||0;S.render();const updated=document.getElementById('as-message-scroll');if(updated)updated.scrollTop=near?updated.scrollHeight:top;if(id){const next=document.getElementById(id);if(next){next.focus({preventScroll:true});if(typeof next.setSelectionRange==='function'&&start!=null)try{next.setSelectionRange(start,end);}catch(_){}}}}
  S.page('chat',{title:'Agent Chat',section:'开始创造',render(){const a=agentNow();if(!a)return S.empty('先创建智能体','为你的工作配置一个搭档。',S.btn('创建智能体','new-agent'));const session=sessionFor(a),active=busy(session),snapshot=savedConfig(a);return `<div class="as-chat-page ${ui.showCapabilities?'with-capabilities':''}"><header class="as-chat-header"><div class="row">${avatar(a)}<div><h1>${E(a.name)}</h1><p>${E(session.model||snapshot.model)} · ${E(a.publishedConfig?snapshot.version:'未发布草稿')} · 本地模拟</p></div></div><div class="row">${S.btn('历史会话','as-history',{variant:'ghost',icon:'clock',small:true})}${S.btn('新会话','as-new-session',{variant:'secondary',icon:'plus',small:true})}<button type="button" class="icon-btn ${ui.showCapabilities?'is-active':''}" data-action="as-toggle-panel" aria-label="${ui.showCapabilities?'收起':'展开'}本次能力" aria-pressed="${ui.showCapabilities}">${S.icon('layers',18)}</button><a href="#agent?id=${encodeURIComponent(a.id)}" class="icon-btn" aria-label="配置智能体">${S.icon('settings',18)}</a></div></header><div class="as-chat-workspace"><section class="as-conversation"><div class="as-conversation-bar"><span>${S.icon('book',13)}${E(snapshot.knowledge||'未绑定知识库')}</span><span>${S.icon('plug',13)}${session.capabilityBindings.filter(b=>b.enabled!==false).length} 项工具</span><span>${S.icon('shield',13)}写入前确认</span></div><div class="as-message-scroll" id="as-message-scroll" aria-live="polite" aria-relevant="additions text">${chatMessages(a,session)}</div><form class="as-chat-composer" data-form="as-send" novalidate><label class="as-sr-only" for="as-chat-input">发送消息</label><textarea id="as-chat-input" style="resize:none" placeholder="描述目标；也可以告诉我把结果放在哪里…" rows="3">${E(ui.chatText[session.id]||'')}</textarea><p class="field-error" id="as-chat-input-error" role="alert"></p><div class="as-composer-bottom"><div class="mode-pill" aria-label="Agent 模式">${[['chat','对话'],['plan','规划'],['execute','执行']].map(([v,l])=>`<button type="button" data-action="as-chat-mode" data-id="${v}" class="${session.mode===v?'active':''}" aria-pressed="${session.mode===v}">${l}</button>`).join('')}</div><div class="row"><button type="button" class="icon-btn" data-action="as-add-capability" data-target="session" aria-label="选择本轮工具">${S.icon('plug',17)}</button>${active?S.btn('停止','as-stop',{variant:'secondary',small:true,icon:'stop'}):S.btn('发送','as-send',{small:true,icon:'arrow'})}</div></div></form><div class="as-composer-caption"><span>Enter 发送 · Shift + Enter 换行</span><span>${session.mode==='plan'?'先形成计划，点击开始后执行':'工具使用本地适配器模拟'}</span></div></section>${ui.showCapabilities?capabilityPanel(a,session):''}</div></div>`;},mount(root){
    const a=agentNow();if(!a)return;const session=sessionFor(a),input=root.querySelector('#as-chat-input');input.addEventListener('input',()=>{ui.chatText[session.id]=input.value;});input.addEventListener('keydown',ev=>{if(!ev.isComposing&&ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();S.actions['as-send']();}});
    const change=ev=>{const el=ev.target;if(el.dataset.asToggleTool){toggleBinding(session,el.dataset.asToggleTool);S.save();refreshChat();return;}const map={'as-chat-model':'model','as-chat-tool-mode':'toolMode','as-chat-forced':'forcedToolId','as-chat-context-call':'contextCall','as-chat-destination':'destination','as-chat-scenario':'scenario','as-chat-args':'argsText'};if(map[el.id]){session[map[el.id]]=el.value;S.save();if(el.id==='as-chat-tool-mode')refreshChat();}};
    root.addEventListener('change',change);let queued=false;const unsubscribe=R.subscribe(run=>{if(run.conversationId!==session.id&&run.id!==session.messages.map(m=>R.findRun(m.runId)?.activeChildRunId).find(id=>id===run.id))return;if(queued)return;queued=true;queueMicrotask(()=>{queued=false;if(S.route==='chat'&&currentSession()?.id===session.id&&!document.getElementById('app-dialog')?.open)refreshChat();});});
    if(S.session.pendingMessage){const pending=S.session.pendingMessage;S.session.pendingMessage=null;session.mode=pending.mode||session.mode;queueMicrotask(()=>sendMessage(pending.text));}
    return()=>{unsubscribe();root.removeEventListener('change',change);};
  }});
  function sendMessage(text,mode,snapshot,sessionSnapshot){const a=agentNow(),session=currentSession();if(!a||!session||busy(session))return;const goal=(text??document.getElementById('as-chat-input')?.value??ui.chatText[session.id]??'').trim();if(!goal){document.getElementById('as-chat-input')?.focus();return;}if(session.argsText?.trim()){try{const args=JSON.parse(session.argsText);if(!args||typeof args!=='object'||Array.isArray(args))throw Error();}catch(_){document.getElementById('as-chat-input-error').textContent='调试实参需要有效的 JSON 对象，请在右侧修正。';return;}}
    session.messages.push({id:S.uid('message'),role:'user',content:goal});const msg={id:S.uid('message'),role:'assistant',content:'',status:'running'};session.messages.push(msg);if(session.title==='新的会话')session.title=goal.slice(0,24);ui.chatText[session.id]='';const run=startAgent({agentId:a.id,goal,mode:mode||session.mode,session,message:msg,snapshot,sessionSnapshot});msg.runId=run.id;S.save();refreshChat();
  }
  S.action('as-send',()=>sendMessage());S.form('as-send',()=>sendMessage());
  S.action('as-chat-example',el=>{const session=currentSession();session.mode=el.dataset.mode;sendMessage(el.dataset.text);});
  S.action('as-chat-mode',el=>{currentSession().mode=el.dataset.id;S.save();refreshChat();});
  S.action('as-toggle-panel',()=>{ui.showCapabilities=!ui.showCapabilities;refreshChat();});
  S.action('as-stop',()=>{const session=currentSession(),run=[...session.messages].reverse().map(m=>m.runId&&R.findRun(m.runId)).find(r=>r&&['running','waiting'].includes(r.status));if(run){R.stop(run.id);if(run.activeChildRunId)R.stop(run.activeChildRunId);S.toast('已停止本轮后续执行','info');refreshChat();}});
  S.action('as-new-session',()=>{const a=agentNow();const snap=savedConfig(a),session={id:S.uid('conversation'),agentId:a.id,title:'新的会话',messages:[],created:Date.now(),mode:'chat',model:snap.model,capabilityBindings:clone(snap.capabilityBindings),contextBindings:clone(snap.contextBindings),toolMode:snap.executionPolicy.toolMode,forcedToolId:snap.executionPolicy.forcedToolId||'',scenario:'success',destination:'/知识库/行业观察',argsText:''};S.state.chatSessions.unshift(session);S.save();S.go('chat',{agent:a.id,session:session.id});});
  S.action('as-history',()=>{const a=agentNow(),list=S.state.chatSessions.filter(x=>x.agentId===a.id);S.drawer({title:'会话记录',subtitle:a.name+' · 当前空间',body:`<div class="as-history">${list.map(s=>`<button type="button" data-action="as-open-session" data-id="${E(s.id)}"><span>${S.icon('agent',18)}</span><div><strong>${E(s.title)}</strong><small>${s.messages.filter(m=>m.role==='user').length} 轮对话 · ${new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(s.created))}</small></div>${busy(s)?S.badge('进行中','info'):''}${S.icon('arrow',14)}</button>`).join('')}</div>`});});
  S.action('as-open-session',el=>{S.closeModal();S.go('chat',{agent:agentNow().id,session:el.dataset.id});});
  S.action('as-reset-session',()=>{const a=agentNow(),s=currentSession(),snap=savedConfig(a);s.capabilityBindings=clone(snap.capabilityBindings);s.contextBindings=clone(snap.contextBindings);s.toolMode=snap.executionPolicy.toolMode;s.forcedToolId=snap.executionPolicy.forcedToolId;s.model=snap.model;s.contextCall='';S.save();refreshChat();S.toast('下一轮使用当前发布配置');});
  S.action('as-session-to-draft',()=>{const a=agentNow(),s=currentSession();a.capabilityBindings=clone(s.capabilityBindings);a.contextBindings=clone(s.contextBindings);a.executionPolicy={...policyDefault,...a.executionPolicy,toolMode:s.toolMode,forcedToolId:s.forcedToolId};a.status='draft';a.updated='刚刚';delete ui.drafts[a.id];S.save();S.toast('会话能力已保存为 Agent 草稿，发布版本保持不变');});
  S.action('as-execute-plan',el=>{const old=R.findRun(el.dataset.run);if(!old?.plan)return;sendMessage(old.plan.goal,'execute',old.plan.snapshot,old.plan.sessionSnapshot);});
  S.action('as-retry-message',el=>{const old=R.findRun(el.dataset.run);if(old)sendMessage(old.goal||old.inputs.message,old.inputs.mode);});
  S.action('as-copy-message',el=>{const m=currentSession().messages[+el.dataset.index],run=m.runId&&R.findRun(m.runId);S.copy(run?.answer||m.content);});
  S.action('as-save-memory',el=>{const a=agentNow(),session=currentSession(),m=session.messages[+el.dataset.index],run=m.runId&&R.findRun(m.runId),policy=savedConfig(a).memoryPolicy?.write||'ask';if(policy==='off'){S.toast('此 Agent 已关闭记忆写入，可在知识与记忆中调整','info');return;}S.modal({title:'保存为记忆',subtitle:policy==='session'?'只用于当前会话的后续消息。':'保存到当前空间，下次对话可作为上下文。',body:`<div class="field"><label class="field-label" for="as-memory-content">要保留的内容</label><textarea class="textarea" id="as-memory-content" style="resize:none" rows="7">${E((run?.answer||m.content||'').slice(0,600))}</textarea><p class="field-error" id="as-memory-error"></p></div>`,footer:S.btn('取消','modal-close',{variant:'secondary'})+S.btn('保存记忆','as-confirm-memory',{icon:'book',attrs:`data-scope="${policy==='session'?'session':'space'}"`})});});
  S.action('as-confirm-memory',el=>{const content=document.getElementById('as-memory-content').value.trim();if(!content){document.getElementById('as-memory-error').textContent='请填写需要保留的内容';return;}S.state.agentMemory=S.state.agentMemory||[];S.state.agentMemory.push({id:S.uid('memory'),agentId:agentNow().id,sessionId:currentSession().id,scope:el.dataset.scope,content,created:Date.now()});S.save();S.closeModal();S.toast('记忆已保存');});
  S.action('chat-execute',el=>{const run=startAgent({agentId:el.dataset.agent||S.params.agent,goal:el.dataset.goal||'新的任务',mode:'execute',model:el.dataset.model});if(run)S.go('task',{id:run.id});});
  S.action('help',()=>S.modal({title:'开始体验完整工作链',subtitle:'所有外部能力使用本地模拟适配器；运行参数与路径按配置执行。',wide:true,body:`<div class="as-guide"><a href="#mcp"><span>${S.icon('plug',25)}</span><h3>MCP 调试</h3><p>选工具、改参数、切换失败场景，查看协议与统一调用记录。</p></a><a href="#workflow"><span>${S.icon('workflow',25)}</span><h3>配置工作流</h3><p>选择节点、绑定上游变量、设置分支，再运行成功或空结果场景。</p></a><a href="#chat?agent=research"><span>${S.icon('agent',25)}</span><h3>增强 Agent Chat</h3><p>启用 MCP 与插件，读取资料或确认写入指定位置。</p></a><a href="#tasks"><span>${S.icon('chart',25)}</span><h3>追踪执行结果</h3><p>查看返回值、操作回执和文件；无返回值也可以成功完成。</p></a></div>`,footer:S.btn('开始探索','modal-close',{icon:'arrow'})}));
})();

</script>
